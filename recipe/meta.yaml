{% set name = "rerun-sdk" %}
{% set version = "0.34.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/rerun-io/rerun/archive/refs/tags/{{ version }}.tar.gz
  sha256: e95e23ef3d17f494edd0188a824fa37ebc5d01726358502ac74b1e949f1aacef

build:
  number: 1
  skip: true  # [py<38]
  # nodejs doesn't support ppc64le
  skip: true  # [ppc64le]
  entry_points:
    - rerun = rerun.__main__:main
  script_env:
    - AR
  # gilrs (gamepad support, new in rerun 0.34.0) links the always-present
  # WinRT API-set umbrella DLL, which conda-build's overlinking check flags
  missing_dso_whitelist:
    - '*/api-ms-win-core-winrt-l1-1-0.dll'  # [win]

requirements:
  build:
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - crossenv                               # [build_platform != target_platform]
    - python                                 # [build_platform != target_platform]
    - maturin >=1.3.0                        # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}  # [target_platform != "osx-arm64"]
    - rust {{ rust_compiler_version }}  # [target_platform == "osx-arm64"]
    - rust-std-aarch64-apple-darwin  # [target_platform == "osx-arm64"]
    - cargo-bundle-licenses
    - rust-std-wasm32-unknown-unknown
    # binaryen gives us wasm-opt, for optimizing the an .wasm file for speed and size
    - binaryen
    - nodejs >=20.12
    - nasm
    - clang ==16.0.6  # [not osx]
    # needed to get protoc for to lance
    - libprotobuf
    # gilrs (gamepad support, new in rerun 0.34.0) uses libudev-sys on linux,
    # which shells out to pkg-config at build time
    - pkg-config  # [linux]
  host:
    - anywidget
    - hatch
    - hatch-jupyter-builder
    - python
    - pip
    - maturin >=1.3.0
    # provides libudev.pc / the udev library that gilrs-core links against.
    # Cap below 258: libudev 258+ is built against glibc 2.34, but this
    # feedstock builds against the c_stdlib 2.17 sysroot, so linking a
    # 2.34 libudev.so fails the --no-allow-shlib-undefined check. 257.x
    # is the newest series still built against glibc 2.17.
    - libudev <258  # [linux]
  run:
    - python
    - attrs >=23.1.0
    - anywidget
    - jupyter-ui-poll
    - ipykernel <7.0.0
    - numpy >=1.23
    - pillow >=8.0.0
    - psutil >=7.0
    - pyarrow >=18.0.0
    - typing_extensions >=4.5

# TODO(jleibs): Would be nice to add this constraint, but it causes test to fail
# to solve. Just live with the lack of constraint for now.
#
# run_constrained:
#   - __glibc >=2.27                                        # [linux]

test:
  requires:
    - packaging

about:
  home: https://www.rerun.io/
  summary: Rerun is an SDK for logging computer vision and robotics data paired with a visualizer for exploring that data over time.
  description: |
    Rerun is an SDK for logging computer vision and robotics data paired with a visualizer for exploring that data over time.
    It lets you debug and understand the internal state and data of your systems with minimal code.

    Note: This conda package bundles both the functionality of the PyPI packages `rerun-sdk` and `rerun-notebook` as a single installable package.
  license: MIT OR Apache-2.0
  license_file:
    - THIRDPARTY.yml
    - LICENSE-MIT
    - LICENSE-APACHE

  doc_url: https://www.rerun.io/docs
  dev_url: https://github.com/rerun-io/rerun

extra:
  recipe-maintainers:
    - oxkitsune
    - aedm
    - abey79
    - ntjohnson1
    - jeongseok-meta
    - ruben-arts
    - jleibs
    - traversaro
